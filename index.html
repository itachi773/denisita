<style>
:root {
    --rosa: #FFD1DC;
    --azul: #AEC6CF;
    --verde: #B2E2D2;
    --crema: #FFF9F1;
    --texto: #555;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background-color: var(--crema);
    color: var(--texto);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

header {
    padding: 40px 20px;
    text-align: center;
}

.menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    padding: 20px;
    width: 90%;
    max-width: 400px;
}

.menu-item {
    background: white;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    transition: transform 0.2s;
    border: 2px solid transparent;
    cursor: pointer;
}

.menu-item:active { transform: scale(0.95); }

.icon { font-size: 2rem; display: block; margin-bottom: 10px; }

#modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    overflow-y: auto;
}

/* CONFETI */
.confeti {
    position: fixed;
    width: 8px;
    height: 8px;
    top: -10px;
    animation: caer 2s linear forwards;
    z-index: 999;
}

@keyframes caer {
    to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}

/* ===== PANTALLA BIENVENIDA ===== */
#pantallaInicio {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--crema);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 30px;
    box-sizing: border-box;
    text-align: center;
}

#pantallaInicio h2 {
    font-size: 1.6rem;
    color: #888;
    margin-bottom: 10px;
}

#pantallaInicio p {
    color: #aaa;
    margin-bottom: 30px;
    font-size: 0.95rem;
}

#inputNombre {
    padding: 14px 20px;
    border-radius: 25px;
    border: 2px solid var(--rosa);
    font-size: 1rem;
    text-align: center;
    outline: none;
    width: 240px;
    background: white;
    color: var(--texto);
    margin-bottom: 15px;
    display: block;
}

#btnEntrar {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    background: var(--rosa);
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.2s;
}

#btnEntrar:active { transform: scale(0.95); }

#errorNombre {
    color: #e88;
    font-size: 0.85rem;
    margin-top: 8px;
    min-height: 18px;
}

/* ===== CAJA DE COMENTARIOS ===== */
#cajaComentarios {
    width: 90%;
    max-width: 400px;
    margin: 20px auto 40px;
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    text-align: center;
}

#cajaComentarios h3 {
    color: #888;
    font-size: 1rem;
    margin-bottom: 15px;
}

#textComentario {
    width: 100%;
    border: 2px solid var(--rosa);
    border-radius: 15px;
    padding: 12px;
    font-size: 0.95rem;
    font-family: 'Segoe UI', sans-serif;
    resize: none;
    outline: none;
    box-sizing: border-box;
    color: var(--texto);
    background: #fff9f9;
}

#btnEnviarComentario {
    margin-top: 12px;
    padding: 10px 25px;
    border-radius: 20px;
    border: none;
    background: var(--rosa);
    cursor: pointer;
    font-size: 0.95rem;

#btnEnviarComentario:active { transform: scale(0.95); }

#msgComentario {

    margin-top: 8px;
    min-height: 18px;

/* ===== PANEL ADMIN ===== */

.visita-item, .comentario-item {

</style>

// ============================================================
// NOMBRE + REGISTRO DE VISITA
// ============================================================

let nombreUsuario = "";

function entrarConNombre(){
    const input = document.getElementById("inputNombre");
    const nombre = input.value.trim();

    if(!nombre){
        document.getElementById("errorNombre").textContent = "Ponle tu nombre para entrar 💕";
        return;
    }

    nombreUsuario = nombre;
    registrarVisita(nombre);

    const pantalla = document.getElementById("pantallaInicio");
    pantalla.style.transition = "opacity 0.5s";
    pantalla.style.opacity = "0";
    setTimeout(() => { pantalla.style.display = "none"; }, 500);
}

document.getElementById("inputNombre").addEventListener("keydown", function(e){
    if(e.key === "Enter") entrarConNombre();
});

function registrarVisita(nombre){
    const ahora = new Date();
    const fecha = ahora.toLocaleString("es-CO", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
    });

    fetch("https://ipapi.co/json/")
        .then(r => r.json())
        .then(data => {
            const lugar = data.city && data.country_name
                ? `${data.city}, ${data.country_name}`
                : "Lugar desconocido";
            push(ref(db, "visitas"), { nombre, fecha, lugar });
        })
        .catch(() => {
            push(ref(db, "visitas"), { nombre, fecha, lugar: "Lugar no disponible" });
        });
}

// ============================================================
// COMENTARIOS
// ============================================================

function enviarComentario(){
    const texto = document.getElementById("textComentario").value.trim();
    const msg = document.getElementById("msgComentario");

    if(!texto){
        msg.textContent = "Escribe algo primero 💭";
        return;
    }
    if(!nombreUsuario){
        msg.textContent = "Necesitas entrar primero con tu nombre";
        return;
    }

    const ahora = new Date();
    const fecha = ahora.toLocaleString("es-CO", {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
    });

    push(ref(db, "comentarios"), { nombre: nombreUsuario, texto, fecha })
        .then(() => {
            document.getElementById("textComentario").value = "";
            msg.textContent = "¡Mensajito guardado! 💌";
            setTimeout(() => { msg.textContent = ""; }, 3000);
        })
        .catch(() => {
            msg.textContent = "Error al guardar, intenta de nuevo 😔";
        });
}

function abrirAdmin(){

    document.getElementById("msgAdminError").textContent = "";
}

function cerrarAdmin(){
    document.getElementById("modalAdmin").style.display = "none";
}

function verificarAdmin(){
    const pass = document.getElementById("inputAdminPass").value;
    if(pass === ADMIN_PASSWORD){
        document.getElementById("adminLogin").style.display = "none";
        document.getElementById("adminContenido").style.display = "block";
        cargarDatosAdmin();
    } else {
        document.getElementById("msgAdminError").textContent = "Contraseña incorrecta 👀";
    }
}

function cargarDatosAdmin(){
    const listaV = document.getElementById("listaVisitas");
    const listaC = document.getElementById("listaComentarios");

    listaV.innerHTML = `<div style="color:#bbb;font-size:0.85rem;">Cargando...</div>`;
    listaC.innerHTML = `<div style="color:#bbb;font-size:0.85rem;">Cargando...</div>`;

    // Visitas
    get(ref(db, "visitas")).then(snapshot => {
        if(!snapshot.exists()){
            listaV.innerHTML = `<div style="color:#bbb;font-size:0.85rem;">Nadie ha entrado todavía</div>`;
        } else {
            const items = [];
            snapshot.forEach(child => items.push(child.val()));
            listaV.innerHTML = items.reverse().map(v => `
                <div class="visita-item">
                    <strong>${v.nombre}</strong> — ${v.fecha}<br>
                    <span style="color:#bbb;">📍 ${v.lugar}</span>
                </div>
            `).join("");
        }
    });

    // Comentarios
    get(ref(db, "comentarios")).then(snapshot => {
        if(!snapshot.exists()){
            listaC.innerHTML = `<div style="color:#bbb;font-size:0.85rem;">Aún no hay comentarios</div>`;
        } else {
            const items = [];
            snapshot.forEach(child => items.push(child.val()));
            listaC.innerHTML = items.reverse().map(c => `
                <div class="comentario-item">
                    <div class="comentario-nombre">${c.nombre}</div>
                    <div class="comentario-texto">"${c.texto}"</div>
                    <div class="comentario-fecha">${c.fecha}</div>
                </div>
            `).join("");
        }
    });
}

function limpiarVisitas(){
    if(confirm("¿Borrar todas las visitas?")){
        remove(ref(db, "visitas")).then(() => cargarDatosAdmin());
    }
}

/* 🔊 Pausa todos los audios automáticamente */
function pausarTodos() {
    document.querySelectorAll("audio").forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
    });
}

/* 🔊 Reproduce solo uno */
function toggleAudio(id) {
    const audio = document.getElementById(id);

    if (!audio) return;

    if (!audio.paused) {
        audio.pause();
    } else {
        pausarTodos();
        audio.play();
    }
}
